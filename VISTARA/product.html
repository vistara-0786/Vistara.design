<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VISTARA — Product</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf8f4;
    color: #222;
    font-family: Georgia, "Times New Roman", serif;
}

.header {
    height: 90px;
    background: #fffdf9;
    border-bottom: 1px solid #e5ddd2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo-mark {
    width: 46px;
    height: 46px;
    border: 1px solid #b99a68;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #a27d45;
    font-size: 24px;
}

.brand-name {
    letter-spacing: 5px;
}

.navigation {
    display: flex;
    gap: 30px;
}

.navigation a,
.bag {
    text-decoration: none;
    color: #222;
    font-size: 12px;
    letter-spacing: 2px;
}

.product-page {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 40px 5%;
    display: grid;
    grid-template-columns: 1.25fr .75fr;
    gap: 50px;
    align-items: center;
}

.product-detail-image {
    width: 100%;
    height: 720px;
    background: #f2eee8;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.product-detail-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.product-detail-info {
    max-width: 520px;
}

.eyebrow {
    font-size: 11px;
    letter-spacing: 5px;
    color: #a27d45;
}

.product-detail-info h1 {
    font-size: 43px;
    line-height: 1.1;
    font-weight: normal;
    margin: 20px 0;
}

.product-price {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 25px;
}

.old-price {
    color: #999;
    text-decoration: line-through;
}

.new-price {
    font-size: 28px;
    font-weight: bold;
}

.discount {
    color: #a27d45;
    font-size: 12px;
}

.product-description {
    line-height: 1.8;
    font-size: 16px;
}

.product-actions {
    display: flex;
    gap: 12px;
    margin: 30px 0;
}

.add-to-bag,
.buy-now {
    height: 55px;
    padding: 0 28px;
    border: 1px solid #25211d;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    font-family: inherit;
    letter-spacing: 2px;
    font-size: 11px;
    cursor: pointer;
}

.add-to-bag {
    background: #25211d;
    color: white;
}

.buy-now {
    background: white;
    color: #222;
}

.product-details {
    border-top: 1px solid #ddd5ca;
    padding-top: 20px;
}

.product-details p {
    font-size: 14px;
    margin: 12px 0;
}

footer {
    margin-top: 50px;
    padding: 60px 20px;
    text-align: center;
    background: #25211d;
    color: white;
}

.footer-links {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 25px;
}

.footer-links a {
    color: white;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
}

@media(max-width: 800px) {

    .header {
        padding: 12px 20px;
    }

    .navigation {
        display: none;
    }

    .product-page {
        display: block;
        padding: 20px 15px;
    }

    .product-detail-image {
        height: auto;
        min-height: 520px;
    }

    .product-detail-image img {
        width: 100%;
        height: auto;
        max-height: 700px;
    }

    .product-detail-info {
        padding: 30px 5px;
    }

    .product-detail-info h1 {
        font-size: 32px;
    }

    .product-actions {
        flex-direction: column;
    }

    .add-to-bag,
    .buy-now {
        width: 100%;
    }
}

</style>

</head>

<body>


<header class="header">

    <div class="brand">

        <div class="logo-mark">V</div>

        <div class="brand-name">
            VISTARA
        </div>

    </div>

    <nav class="navigation">

        <a href="index.html">HOME</a>
        <a href="shop.html">SHOP</a>
        <a href="index.html#about">ABOUT</a>
        <a href="index.html#account">ACCOUNT</a>

    </nav>

    <a href="bag.html" class="bag">
        BAG
    </a>

</header>


<main>

<section class="product-page">


<div class="product-detail-image">

    </p>

    <div class="product-price">

        <span id="oldPrice" class="old-price"></span>

        <span id="discount" class="discount"></span>

    </div>


    <p class="product-description">

        A refined piece designed for effortless
        everyday style and timeless elegance.

    </p>


    <div class="product-actions">

        <button
            class="add-to-bag"
            onclick="addToBag()">

            ADD TO BAG

        </button>


        <a
            href="checkout.html"
            class="buy-now">

            BUY NOW

        </a>

    </div>


    <div class="product-details">

        <p>
            <strong>Collection:</strong>
            Men's Necklace
        </p>

        <p>
            <strong>Delivery:</strong>
            India
        </p>

        <p>
            <strong>Payment:</strong>
            COD & UPI
        </p>

    </div>

</div>


</section>

</main>


<footer>

    <h3>VISTARA</h3>

    <p>
        QUIET LUXURY. TIMELESS BEAUTY.
    </p>

    <div class="footer-links">

        <a href="index.html">HOME</a>
        <a href="shop.html">SHOP</a>
        <a href="index.html#about">ABOUT</a>

    </div>

</footer>

</html>
